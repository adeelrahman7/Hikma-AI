  <!-- Scroll Fade-In Observer Script -->
  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.15 });

    // Observe description and button
    document.querySelectorAll('.subtitle, .cta-btn').forEach(el => observer.observe(el));
  </script>
