<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard | Hikma AI</title>

<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>

<!-- Injected by nav.js -->
<div id="main-nav"></div>
<div id="nav-root"></div>
<script src="/static/js/nav.js"></script>

<main class="dashboard-container" id="dashboardContainer">

    <div class="dashboard-header">
    <h1>Your Documents</h1>
    <p class="dashboard-subtitle">Pick up where you left off, or upload something new.</p>
    </div>

    <div class="dashboard-stats" id="dashboardStats">
    <!-- filled in by loadDashboard() -->
    </div>

    <!-- Shown while /documents is loading -->
    <div class="dashboard-loading" id="dashboardLoading">
    <div class="spinner"></div>
    <p>Loading your documents...</p>
    </div>

    <!-- Shown if /documents can't be reached -->
    <div class="dashboard-error" id="dashboardError" style="display:none;">
    <p id="dashboardErrorText">Couldn't load your documents.</p>
    <button class="check-btn" type="button" onclick="loadDashboard()">Try again</button>
    </div>

    <!-- Shown when there are zero documents -->
    <section class="empty-state" id="dashboardEmptyState" style="display:none;">
    <div class="empty-state-icon">📄</div>
    <h2>No documents yet</h2>
    <p>Upload a study document to generate a summary, flashcards, and practice questions.</p>
    <a href="upload.html" class="cta-btn">Upload a document</a>
    </section>

    <!-- The actual document grid -->
    <div class="doc-grid" id="docGrid" style="display:none;"></div>

    <div class="dashboard-upload-more" id="dashboardUploadMore" style="display:none;">
    <a href="upload.html" class="cta-btn upload-more-btn">+ Upload another document</a>
    </div>

</main>

<!-- Confirm dialog (used for delete) -->
<div class="confirm-modal-overlay" id="confirmModalOverlay" style="display: none;">
    <div class="confirm-modal" role="alertdialog" aria-labelledby="confirmModalTitle" aria-describedby="confirmModalMessage">
    <h3 id="confirmModalTitle">Delete document?</h3>
    <p id="confirmModalMessage"></p>
    <div class="confirm-modal-actions">
        <button class="confirm-modal-btn cancel" type="button" id="confirmModalCancel">Cancel</button>
        <button class="confirm-modal-btn danger" type="button" id="confirmModalConfirm">Delete</button>
    </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8000";
    const API_KEY = null; // set this if API_KEY_ENABLED=true in your .env

    const statsEl = document.getElementById("dashboardStats");
    const loadingEl = document.getElementById("dashboardLoading");
    const errorEl = document.getElementById("dashboardError");
    const errorTextEl = document.getElementById("dashboardErrorText");
    const emptyStateEl = document.getElementById("dashboardEmptyState");
    const docGridEl = document.getElementById("docGrid");
    const uploadMoreEl = document.getElementById("dashboardUploadMore");

    function messageForStatus(status, detail) {
    switch (status) {
        case 429:
        return "Too many requests right now — wait a minute and try again.";
        case 500:
        return "Something went wrong on the server while listing your documents.";
        default:
        return detail || "Something went wrong. Please try again.";
    }
    }

    function formatDate(isoString) {
    if (!isoString) return "";
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return isoString;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    // Opens a document in the Study page, the same way upload.html does
    // right after a fresh upload — just setting the same localStorage keys
    // study.html already reads on load.
    function continueStudying(doc) {
    localStorage.setItem("documentId", doc.id);
    localStorage.setItem("documentName", doc.filename);
    localStorage.setItem("documentTopics", JSON.stringify(doc.topics || []));
    navigateWithTransition("study.html");
    }

    function renderStats(docs) {
    const totalDocs = docs.length;
    const uniqueTopics = new Set();
    docs.forEach(d => (d.topics || []).forEach(t => uniqueTopics.add(t)));

    const lastActiveId = localStorage.getItem("documentId");
    const lastActiveDoc = docs.find(d => d.id === lastActiveId);

    statsEl.innerHTML = `
        <div class="stat-tile">
        <span class="stat-tile-value">${totalDocs}</span>
        <span class="stat-tile-label">${totalDocs === 1 ? "document" : "documents"} uploaded</span>
        </div>
        <div class="stat-tile">
        <span class="stat-tile-value">${uniqueTopics.size}</span>
        <span class="stat-tile-label">topics covered</span>
        </div>
        ${lastActiveDoc ? `
        <div class="stat-tile stat-tile-accent" id="continueTile">
            <span class="stat-tile-label">Continue studying</span>
            <span class="stat-tile-doc-name">${lastActiveDoc.filename}</span>
        </div>
        ` : ""}
    `;

    const continueTile = document.getElementById("continueTile");
    if (continueTile && lastActiveDoc) {
        continueTile.addEventListener("click", () => continueStudying(lastActiveDoc));
    }
    }

    // Escapes text dropped into innerHTML (filenames can contain &, <, >, quotes).
    function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Custom confirm dialog — replaces the browser's confirm() with a styled
    // modal that matches the rest of the app. Resolves true/false, same as
    // confirm() would, so callers can just `await` it.
    const confirmModalOverlay = document.getElementById("confirmModalOverlay");
    const confirmModalMessage = document.getElementById("confirmModalMessage");
    const confirmModalCancelBtn = document.getElementById("confirmModalCancel");
    const confirmModalConfirmBtn = document.getElementById("confirmModalConfirm");

    function showConfirmModal(message) {
    confirmModalMessage.textContent = message;
    confirmModalOverlay.style.display = "flex";
    // Force layout, then add "open" so the fade/scale transition actually plays
    // instead of jumping straight to its end state.
    requestAnimationFrame(() => confirmModalOverlay.classList.add("open"));

    return new Promise((resolve) => {
        const cleanup = (result) => {
        confirmModalOverlay.classList.remove("open");
        // Let the fade-out transition finish before actually hiding it.
        setTimeout(() => { confirmModalOverlay.style.display = "none"; }, 180);
        confirmModalConfirmBtn.removeEventListener("click", onConfirm);
        confirmModalCancelBtn.removeEventListener("click", onCancel);
        confirmModalOverlay.removeEventListener("click", onOverlayClick);
        document.removeEventListener("keydown", onKeydown);
        resolve(result);
        };
        const onConfirm = () => cleanup(true);
        const onCancel = () => cleanup(false);
        const onOverlayClick = (e) => {
        if (e.target === confirmModalOverlay) cleanup(false);
        };
        const onKeydown = (e) => {
        if (e.key === "Escape") cleanup(false);
        };

        confirmModalConfirmBtn.addEventListener("click", onConfirm);
        confirmModalCancelBtn.addEventListener("click", onCancel);
        confirmModalOverlay.addEventListener("click", onOverlayClick);
        document.addEventListener("keydown", onKeydown);
    });
    }

    function renderDocGrid(docs) {
    docGridEl.innerHTML = docs.map(doc => {
        const topicChips = (doc.topics || []).slice(0, 4)
        .map(t => `<span class="doc-topic-chip">${escapeHtml(t)}</span>`).join("");
        return `
        <div class="doc-card" data-doc-id="${doc.id}">
            <div class="doc-card-menu">
            <button class="doc-card-menu-btn" type="button" data-doc-id="${doc.id}" aria-label="Document options">⋮</button>
            <div class="doc-card-menu-dropdown" data-doc-id="${doc.id}">
                <button class="doc-card-menu-item" type="button" data-action="rename" data-doc-id="${doc.id}">Rename</button>
                <button class="doc-card-menu-item danger" type="button" data-action="delete" data-doc-id="${doc.id}">Delete</button>
            </div>
            </div>
            <div class="doc-card-icon">📄</div>
            <h3 class="doc-card-title" data-doc-id="${doc.id}">${escapeHtml(doc.filename)}</h3>
            <p class="doc-card-meta">Uploaded ${formatDate(doc.upload_date)} &middot; ${doc.page_count} page(s)</p>
            <div class="doc-card-topics">${topicChips}</div>
            <button class="cta-btn doc-card-btn" type="button" data-doc-id="${doc.id}">Continue Studying →</button>
        </div>
        `;
    }).join("");

    docGridEl.querySelectorAll(".doc-card-btn").forEach(btn => {
        btn.addEventListener("click", () => {
        const doc = docs.find(d => d.id === btn.dataset.docId);
        if (doc) continueStudying(doc);
        });
    });

    // "..." button — opens/closes this card's dropdown, closing any other open one
    docGridEl.querySelectorAll(".doc-card-menu-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const dropdown = docGridEl.querySelector(
            `.doc-card-menu-dropdown[data-doc-id="${btn.dataset.docId}"]`
        );
        const alreadyOpen = dropdown.classList.contains("open");
        docGridEl.querySelectorAll(".doc-card-menu-dropdown.open").forEach(d => d.classList.remove("open"));
        if (!alreadyOpen) dropdown.classList.add("open");
        });
    });

    // Rename / Delete menu items
    docGridEl.querySelectorAll(".doc-card-menu-item").forEach(item => {
        item.addEventListener("click", (e) => {
        e.stopPropagation();
        const doc = docs.find(d => d.id === item.dataset.docId);
        if (!doc) return;
        item.closest(".doc-card-menu-dropdown").classList.remove("open");
        if (item.dataset.action === "rename") startRename(doc);
        if (item.dataset.action === "delete") deleteDocument(doc);
        });
    });
    }

    // Swaps a doc card's title for an inline text input so renaming happens
    // right on the card instead of a separate dialog.
    function startRename(doc) {
    const titleEl = docGridEl.querySelector(`.doc-card-title[data-doc-id="${doc.id}"]`);
    if (!titleEl) return;

    const input = document.createElement("input");
    input.type = "text";
    input.className = "doc-card-rename-input";
    input.value = doc.filename;
    input.maxLength = 255;
    titleEl.replaceWith(input);
    input.focus();
    input.select();

    let settled = false;
    const commit = async () => {
        if (settled) return;
        settled = true;
        const newName = input.value.trim();
        if (!newName || newName === doc.filename) {
        loadDashboard();
        return;
        }
        await submitRename(doc, newName);
    };
    const cancel = () => {
        if (settled) return;
        settled = true;
        loadDashboard();
    };

    input.addEventListener("blur", commit);
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { e.preventDefault(); cancel(); }
    });
    }

    async function submitRename(doc, newName) {
    const headers = { "Content-Type": "application/json" };
    if (API_KEY) headers["X-API-Key"] = API_KEY;

    try {
        const response = await fetch(`${API_URL}/documents/${doc.id}`, {
        method: "PATCH",
        headers,
        body: JSON.stringify({ new_filename: newName }),
        });
        let data = null;
        try { data = await response.json(); } catch {}

        if (!response.ok) {
        alert(messageForStatus(response.status, data?.detail) || "Couldn't rename that document.");
        loadDashboard();
        return;
        }

        // Keep localStorage in sync if this is the document currently open in Study
        if (localStorage.getItem("documentId") === doc.id) {
        localStorage.setItem("documentName", newName);
        }
        loadDashboard();
    } catch (err) {
        console.error("Rename failed:", err);
        alert("Couldn't reach the server. Is the backend running?");
        loadDashboard();
    }
    }

    async function deleteDocument(doc) {
    const ok = await showConfirmModal(`Delete "${doc.filename}"? This can't be undone.`);
    if (!ok) return;

    const headers = {};
    if (API_KEY) headers["X-API-Key"] = API_KEY;

    try {
        const response = await fetch(`${API_URL}/documents/${doc.id}`, {
        method: "DELETE",
        headers,
        });
        let data = null;
        try { data = await response.json(); } catch {}

        if (!response.ok) {
        alert(messageForStatus(response.status, data?.detail) || "Couldn't delete that document.");
        return;
        }

        // If the deleted document was the one open in Study, clear that pointer
        if (localStorage.getItem("documentId") === doc.id) {
        localStorage.removeItem("documentId");
        localStorage.removeItem("documentName");
        localStorage.removeItem("documentTopics");
        }
        loadDashboard();
    } catch (err) {
        console.error("Delete failed:", err);
        alert("Couldn't reach the server. Is the backend running?");
    }
    }

    // Clicking anywhere outside an open menu closes it
    document.addEventListener("click", () => {
    docGridEl.querySelectorAll(".doc-card-menu-dropdown.open").forEach(d => d.classList.remove("open"));
    });

    async function loadDashboard() {
    loadingEl.style.display = "flex";
    errorEl.style.display = "none";
    emptyStateEl.style.display = "none";
    docGridEl.style.display = "none";
    uploadMoreEl.style.display = "none";
    statsEl.innerHTML = "";

    const headers = {};
    if (API_KEY) headers["X-API-Key"] = API_KEY;

    try {
        const response = await fetch(`${API_URL}/documents`, { headers });
        let data = null;
        try {
        data = await response.json();
        } catch {
        // fall through to generic error below
        }

        if (!response.ok) {
        throw new Error(messageForStatus(response.status, data?.detail));
        }

        const docs = data?.documents || [];
        loadingEl.style.display = "none";

        if (docs.length === 0) {
        emptyStateEl.style.display = "flex";
        return;
        }

        // Most recently uploaded first
        docs.sort((a, b) => new Date(b.upload_date) - new Date(a.upload_date));

        renderStats(docs);
        renderDocGrid(docs);
        docGridEl.style.display = "grid";
        uploadMoreEl.style.display = "flex";
    } catch (err) {
        loadingEl.style.display = "none";
        errorTextEl.textContent = err.message || "Couldn't reach the server. Is the backend running?";
        errorEl.style.display = "flex";
    }
    }

    loadDashboard();
</script>
</body>
</html>
